ServerName localhost

<VirtualHost *:80>
    # Solo public/ debe ser accesible desde Internet. El .env, app/ y config/
    # quedan fuera del directorio público.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
